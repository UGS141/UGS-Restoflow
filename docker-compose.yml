version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: ugs_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=ugs_restoflow
    restart: always

  redis:
    image: redis:7.0-alpine
    container_name: ugs_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ugs_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - MONGO_URI=mongodb://mongodb:27017/ugs_restoflow
      - REDIS_URI=redis://redis:6379/0
      - JWT_SECRET=supersecretjwtkeyforugsrestoflowdev123!
      - ENVIRONMENT=development
    depends_on:
      - mongodb
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ugs_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: always

volumes:
  mongodb_data:
  redis_data:
